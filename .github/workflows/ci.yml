name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which files changed to conditionally run jobs
  changes:
    name: Detect Changes
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-26.04
    outputs:
      integrity: ${{ steps.filter.outputs.integrity }}
      library: ${{ steps.filter.outputs.library }}
      mcp-server: ${{ steps.filter.outputs.mcp-server }}
      docs: ${{ steps.filter.outputs.docs }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            library:
              - 'packages/react-native-nitro-device-info/**'
              - 'example/showcase/**'
              - 'example/benchmark/**'
            integrity:
              - 'packages/react-native-nitro-device-integrity/**'
              - 'example/integrity-demo/**'
            mcp-server:
              - 'packages/mcp-server/**'
            docs:
              - 'docs/**'
            deps:
              - 'package.json'
              - 'yarn.lock'
              - '.yarn/patches/**'
              - 'scripts/security-regressions.cjs'
              - 'scripts/web-package-regressions.cjs'
              - '.github/workflows/ci.yml'
              - 'jest.config.js'
              - 'tsconfig.json'

      - name: Debug outputs
        run: |
          echo "integrity=${{ steps.filter.outputs.integrity }}"
          echo "library=${{ steps.filter.outputs.library }}"
          echo "mcp-server=${{ steps.filter.outputs.mcp-server }}"
          echo "docs=${{ steps.filter.outputs.docs }}"
          echo "deps=${{ steps.filter.outputs.deps }}"

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.library == 'true' || needs.changes.outputs.mcp-server == 'true' || needs.changes.outputs.integrity == 'true' || needs.changes.outputs.deps == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify security patches
        run: yarn test:security

      - name: Run oxlint
        run: yarn lint

      - name: Run TypeScript type check
        run: yarn typecheck

      - name: Run library tests
        if: ${{ needs.changes.outputs.library == 'true' || needs.changes.outputs.deps == 'true' }}
        run: yarn workspace react-native-nitro-device-info test --runInBand

      - name: Type check and build integrity library
        if: ${{ needs.changes.outputs.integrity == 'true' || needs.changes.outputs.deps == 'true' }}
        run: |
          yarn workspace react-native-nitro-device-integrity typecheck
          yarn workspace react-native-nitro-device-integrity prepare

  build:
    name: Build Library
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.library == 'true' || needs.changes.outputs.deps == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build TypeScript
        run: yarn prepare

      - name: Verify build outputs
        run: |
          test -d packages/react-native-nitro-device-info/lib/module || exit 1
          test -d packages/react-native-nitro-device-info/lib/typescript || exit 1
          test -d packages/react-native-nitro-device-info/nitrogen/generated || exit 1

  build-ios:
    name: Build iOS
    runs-on: macos-15
    timeout-minutes: 60
    needs: changes
    if: ${{ needs.changes.outputs.library == 'true' || needs.changes.outputs.deps == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-download-${{ runner.os }}-${{ hashFiles('example/showcase/package.json') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build library
        run: yarn prepare

      - name: Install example dependencies
        working-directory: example/showcase
        run: yarn install --immutable

      - name: Install Pods
        working-directory: example/showcase/ios
        run: pod install

      - name: Build iOS app
        working-directory: example/showcase
        run: |
          xcodebuild \
            -workspace ios/NitroDeviceInfoExample.xcworkspace \
            -scheme NitroDeviceInfoExample \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify bundled privacy manifest
        working-directory: example/showcase
        run: |
          privacy_manifest_path=ios/build/Build/Products/Release-iphonesimulator/NitroDeviceInfoExample.app/NitroDeviceInfo_privacy.bundle/PrivacyInfo.xcprivacy
          test -f "$privacy_manifest_path"
          plutil -lint "$privacy_manifest_path"

  build-android:
    name: Build Android
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.library == 'true' || needs.changes.outputs.deps == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            example/showcase/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build library
        run: yarn prepare

      - name: Install example dependencies
        working-directory: example/showcase
        run: yarn install --immutable

      - name: Run ktlint checks
        working-directory: example/showcase/android
        run: ./gradlew :react-native-nitro-device-info:ktlintCheck --no-daemon

      - name: Build Android app
        working-directory: example/showcase/android
        run: ./gradlew :app:assembleDebug --no-daemon

  build-integrity:
    name: Build Integrity (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: [changes, lint]
    if: ${{ needs.changes.outputs.integrity == 'true' || needs.changes.outputs.deps == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            runner: macos-15
          - platform: android
            runner: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            example/integrity-demo/android/.gradle
          key: integrity-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            integrity-gradle-${{ runner.os }}-

      - name: Cache CocoaPods downloads
        if: matrix.platform == 'ios'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-download-${{ runner.os }}-${{ hashFiles('example/integrity-demo/package.json') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build integrity library
        run: yarn workspace react-native-nitro-device-integrity prepare

      - name: Install Pods
        if: matrix.platform == 'ios'
        working-directory: example/integrity-demo/ios
        run: pod install

      - name: Build iOS app
        if: matrix.platform == 'ios'
        working-directory: example/integrity-demo
        run: |
          xcodebuild \
            -workspace ios/NitroDeviceIntegrityDemo.xcworkspace \
            -scheme NitroDeviceIntegrityDemo \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Android app
        if: matrix.platform == 'android'
        working-directory: example/integrity-demo/android
        run: ./gradlew :app:assembleDebug --no-daemon

  validate-package:
    name: Validate NPM Package
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.library == 'true' || needs.changes.outputs.deps == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build library
        run: yarn prepare

      - name: Pack NPM package
        working-directory: packages/react-native-nitro-device-info
        run: npm pack

      - name: Verify package contents
        working-directory: packages/react-native-nitro-device-info
        run: |
          tar -tzf *.tgz | grep "package/lib/module/index.js"
          tar -tzf *.tgz | grep "package/lib/typescript"
          tar -tzf *.tgz | grep "package/src/DeviceInfo.nitro.ts"
          tar -tzf *.tgz | grep "package/ios/DeviceInfo.swift"
          tar -tzf *.tgz | grep "package/android"

      - name: Verify web package hooks
        run: yarn test:web

  # MCP Server CI - only runs when packages/mcp-server changes
  mcp-server:
    name: MCP Server
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.mcp-server == 'true' || needs.changes.outputs.deps == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check MCP server
        run: yarn workspace @react-native-nitro-device-info/mcp-server typecheck

      - name: Build MCP server
        run: yarn workspace @react-native-nitro-device-info/mcp-server build

      - name: Run MCP server tests
        run: yarn workspace @react-native-nitro-device-info/mcp-server test

      - name: Verify build outputs
        run: |
          test -d packages/mcp-server/dist || exit 1
          test -f packages/mcp-server/dist/index.js || exit 1
