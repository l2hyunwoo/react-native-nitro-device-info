name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish verified packages to npm (leave disabled for a dry run)'
        type: boolean
        required: true
        default: false
      verify_oidc:
        description: 'Only verify npm OIDC token exchange for all packages; never publish'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Create Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release: ${{ steps.unpublished.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: yarn install --immutable

      - name: Create or update version PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ github.token }}
          version-script: yarn version-packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          create-github-releases: false
          push-git-tags: false

      - name: Verify versioned lockfile
        run: yarn install --immutable

      - name: Check for unpublished versions
        id: unpublished
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          for manifest in packages/*/package.json; do
            read -r name version private < <(node -p "const p = require('./$manifest'); [p.name, p.version, p.private === true].join(' ')")
            [ "$private" = true ] && continue
            if [ -z "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "Unpublished: $name@$version"
              echo 'release=true' >> "$GITHUB_OUTPUT"
            fi
          done

  validate:
    name: Validate Release
    needs: version
    # Merging the version PR leaves no changesets and unpublished versions, which releases automatically.
    if: ${{ !cancelled() && (needs.version.outputs.release == 'true' || (github.event_name == 'workflow_dispatch' && !inputs.verify_oidc)) }}
    uses: ./.github/workflows/ci.yml
    with:
      full_validation: true
    permissions:
      contents: read
      pull-requests: read

  prepare:
    name: Prepare Release Archives
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    needs: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: yarn install --immutable

      - name: Plan, build, pack, and validate unpublished versions
        run: yarn release:prepare

      - name: Upload verified archives
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: .release/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Record dry run result
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: echo 'Dry run completed. Verified archives are attached to this run; npm publication, tags, and GitHub Releases were skipped.' >> "$GITHUB_STEP_SUMMARY"

  verify-oidc:
    name: Verify npm OIDC Token Exchange
    if: github.event_name == 'workflow_dispatch' && inputs.verify_oidc && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Exchange OIDC tokens without publishing
        env:
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: node scripts/release.cjs verify-oidc

  publish:
    name: Publish Verified Archives
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (github.event_name == 'push' || inputs.publish) && github.ref == 'refs/heads/main' }}
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Download exact verified archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: .release
          merge-multiple: true

      - name: Revalidate and publish archives, then create package releases
        env:
          RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.cjs publish
